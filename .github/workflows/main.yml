name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Automatically execute this workflow on a schedule.
  schedule:
    # POSIX-compatible cron syntax is supported.
    - cron: "0 0 * * *" # Rebuild once a day.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      socialMode:
        description: "Social publishing operation (requires opt-in)"
        required: false
        default: publish
        type: choice
        options:
          - publish
          - dry-run
          - backfill
          - initialise
      socialResumeRun:
        description: "Optional main workflow run ID containing a discovery checkpoint"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Front Matter
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pnpm Setup
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node

      - run: pnpm run validate-frontmatter
        name: Check front matter

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pnpm Setup
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for lastMod

      - name: Pnpm Setup
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node
          cache: true

      - name: Setup Astro build cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'astro.config.ts', 'src/content.config.ts', 'tsconfig.json') }}

      # PR builds use dev mode
      - name: Build PR
        if: github.event_name == 'pull_request'
        run: pnpm build --devOutput

      # Regular production build for anything else
      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Prepare social announcement previews
        if: github.event_name == 'pull_request'
        run: node scripts/social/preview.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload social announcement previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: social-preview
          path: social-preview.json
          retention-days: 2

      - name: Verify Feed
        # Skip feed verification in blog repository as it will change frequently
        if: github.repository == 'flcdrg/astro-blog-engine'
        uses: flcdrg/verify-cli-action@v1.2.0
        with:
          file: dist/feed.xml
          verified-directory: verified
          working-directory: .
          scrub-inline-datetime: "yyyy-MM-ddTHH:mm:ss.fffZ"

      - name: Fix sitemap XML formatting
        if: github.repository == 'flcdrg/astro-blog-engine'
        shell: pwsh
        run: |
          ([xml](Get-Content ./dist/sitemap-0.xml)).Save("./dist/sitemap-0.xml")

      - name: Verify sitemap
        # Skip sitemap verification in blog repository as it will be different
        if: github.repository == 'flcdrg/astro-blog-engine'
        uses: flcdrg/verify-cli-action@v1.2.0
        with:
          file: dist/sitemap-0.xml
          verified-directory: verified
          scrub-inline-datetime: "yyyy-MM-ddTHH:mm:ss.fffZ"
          working-directory: .

      - name: Verify post
        if: github.event_name == 'pull_request' || github.repository == 'flcdrg/astro-blog-engine'
        uses: flcdrg/verify-cli-action@v1.2.0
        with:
          file: dist/2025/07/azure-pipeline-template-expression.html
          verified-directory: verified
          working-directory: .
          scrub-inline-pattern: |
            (?<prefix>")/_astro/[^"]+(?<suffix>")
            (?<prefix>title=")[^"]+(?<suffix>")
            (?<prefix>meta name="generator" content="Astro v)[\d\.]+(?<suffix>")
          scrub-inline-remove: ' data-image-component="true"'
          verbosity: detailed

      # Only do this for 'flcdrg/astro-blog-engine' (as the content there is static)
      - name: Verify home
        if: github.repository == 'flcdrg/astro-blog-engine'
        uses: flcdrg/verify-cli-action@v1.2.0
        with:
          file: dist/index.html
          verified-directory: verified
          scrub-inline-pattern: |
            (?<prefix>")/_astro/[^"]+(?<suffix>")
            (?<prefix>title=")[^"]+(?<suffix>")
            (?<prefix>meta name="generator" content="Astro v)[\d\.]+(?<suffix>")
          working-directory: .
          scrub-inline-remove: ' data-image-component="true"'
          verbosity: detailed

      - name: Verify tags
        if: github.repository == 'flcdrg/astro-blog-engine'
        uses: flcdrg/verify-cli-action@v1.2.0
        with:
          file: dist/tags.html
          verified-directory: verified
          scrub-inline-pattern: |
            (?<prefix>")/_astro/[^"]+(?<suffix>")
            (?<prefix>title=")[^"]+(?<suffix>")
            (?<prefix>meta name="generator" content="Astro v)[\d\.]+(?<suffix>")
          working-directory: .
          scrub-inline-remove: ' data-image-component="true"'
          verbosity: detailed

      # dist as artifact
      - name: Upload dist as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true # otherwise .NET.html doesn't get included!
          retention-days: 2

      - name: Upload wrangler.jsonc
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wrangler.jsonc
          path: wrangler.jsonc
          retention-days: 2

  publish_to_cloudflare:
    runs-on: ubuntu-latest
    needs: build
    name: Publish to Cloudflare
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      deployments: write

    if: github.ref == 'refs/heads/main'

    # Allow one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Pnpm Setup
        uses: pnpm/setup@v3.1.2
        with:
          version: 12
          runtime: node@24
          install: false

      - name: Download dist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Setup IndexNow key
        if: github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'
        # Generate files dynamically to prevent them from being leaked in public repositories.
        # This example will put the file in the root directory of the site.You may change the location by yourself.
        run: echo ${{ secrets.INDEXNOW_KEY }} > dist/${{ secrets.INDEXNOW_KEY }}.txt

      - name: Download wrangler.jsonc
        uses: actions/download-artifact@v8.0.2
        with:
          name: wrangler.jsonc
          path: .

      - name: Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  social:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Publish social announcements
    if: github.ref == 'refs/heads/main' && vars.SOCIAL_PUBLISHING_ENABLED == 'true'
    environment: production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: social-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify discovery checkpoint run
        if: inputs.socialResumeRun != ''
        uses: actions/github-script@v9.0.0
        env:
          RESUME_RUN: ${{ inputs.socialResumeRun }}
        with:
          script: |
            const id = process.env.RESUME_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid checkpoint run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.head_branch !== 'main' || run.event === 'pull_request' ||
                run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.path !== '.github/workflows/main.yml') {
              throw new Error('Checkpoint must come from a trusted main publishing run');
            }
      - name: Download discovery checkpoint data
        if: inputs.socialResumeRun != ''
        uses: actions/download-artifact@v8.0.2
        with:
          name: social-discovery-checkpoint
          path: social-checkpoint-artifact
          run-id: ${{ inputs.socialResumeRun }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create repository-scoped automation token
        if: vars.SOCIAL_APP_ID != ''
        id: social-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.SOCIAL_APP_ID }}
          private-key: ${{ secrets.SOCIAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Publish or reconcile social threads
        run: node scripts/social/run.ts "$SOCIAL_MODE"
        env:
          SOCIAL_MODE: ${{ inputs.socialMode || 'publish' }}
          SOCIAL_DEPLOYED: "true"
          SOCIAL_AUTO_MERGE: ${{ vars.SOCIAL_AUTO_MERGE || 'false' }}
          SOCIAL_DISCOVERY_CHECKPOINT: ${{ inputs.socialResumeRun != '' && 'social-checkpoint-artifact/social-discovery-checkpoint.json' || '' }}
          GH_TOKEN: ${{ steps.social-token.outputs.token || secrets.SOCIAL_GITHUB_TOKEN }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: social-backfill-report
          path: social-backfill-report.json
          if-no-files-found: ignore
      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: social-publishing-report
          path: social-publishing-report.json
          if-no-files-found: ignore
      - name: Upload discovery checkpoint
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: social-discovery-checkpoint
          path: social-discovery-checkpoint.json
          if-no-files-found: ignore
      - name: Report publishing failure
        if: failure()
        run: echo 'Social publishing failed or needs reconciliation. Inspect the job log and automation/social-threads journal before retrying; do not delete pending operations.' >> "$GITHUB_STEP_SUMMARY"

  indexnow:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: IndexNow
    if: github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'
    steps:
      - name: indexnow-action
        uses: bojieyang/indexnow-action@v3.0.0
        with:
          sitemap-location: "https://david.gardiner.net.au/sitemap-0.xml"
          limit: 50
          key-location: "https://david.gardiner.net.au/${{ secrets.INDEXNOW_KEY }}.txt"
          key: ${{ secrets.INDEXNOW_KEY }}

  publish_to_cloudflare_pr:
    runs-on: ubuntu-latest
    needs: build
    name: Preview PR on Cloudflare
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    if: github.ref != 'refs/heads/main'

    # Allow one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pnpm Setup
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node

      - name: Download dist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Cloudflare Preview
        uses: cloudflare/wrangler-action@v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Output variables
        run: echo $OUTPUTS
        env:
          OUTPUTS: ${{ toJson(steps.deploy.outputs) }}

      - name: Record preview attachment origin
        run: node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("deployment.json", JSON.stringify({head:process.env.PR_HEAD_SHA,origin:new URL(process.env.PREVIEW_URL).origin}));'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}

      - name: Upload preview attachment origin
        uses: actions/upload-artifact@v7.0.2
        with:
          name: social-preview-deployment
          path: deployment.json
          retention-days: 2

      - name: HTTP redirect testing
        shell: pwsh
        run: |
          $url = "${{ steps.deploy.outputs.deployment-url }}"
          Write-Host "Testing URL: $url"

          ./Test-HttpRedirects.ps1 -url $url

          (Get-Content httptraces.txt)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.x

      - name: Install Verify.Cli
        run: dotnet tool install --global Verify.Cli

      - name: Verify HTTP traces
        run: |
          verify --file httptraces-scrubbed.txt --verified-dir verified

      - name: Diff files if error
        if: failure()
        run: |
          diff -u --strip-trailing-cr verified/httptraces-scrubbed.txt.verified.txt httptraces-scrubbed.txt

      - name: Upload scripts as artifact
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-http-traces
          path: verified
          retention-days: 2

  update_readme:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Update GitHub Profile Readme
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'

    steps:
      - name: Workflow Dispatch
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: Update
          ref: ${{ github.event.ref }}
          repo: flcdrg/flcdrg
          token: ${{ secrets.GH_FLCDRG_PROFILE }}

  ping_superfeedr:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Ping Superfeedr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'

    steps:
      - shell: pwsh
        run: |
          $url = "https://david.gardiner.net.au/feed.xml"
          Write-Host "Pinging Superfeedr with URL: $url"

          $response = Invoke-WebRequest -Method Post -Uri "https://flcdrg.superfeedr.com" -Body @{ "hub.mode" = "publish"; "hub.url" = $url }
          Write-Host "Response: $($response.StatusCode)"

  ping_pubsubhubbub:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Ping PubSubHubbub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'

    steps:
      - shell: pwsh
        run: |
          $url = "https://david.gardiner.net.au/feed.xml"
          Write-Host "Pinging PubSubHubbub with URL: $url"

          $response = Invoke-WebRequest -Method Post -Uri "https://pubsubhubbub.appspot.com/" -Body @{ "hub.mode" = "publish"; "hub.url" = $url }
          Write-Host "Response: $($response.StatusCode)"
