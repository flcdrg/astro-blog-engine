name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Automatically execute this workflow on a schedule.
  schedule:
    # POSIX-compatible cron syntax is supported.
    - cron: "0 0 * * *" # Rebuild once a day.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      linkCache:
        description: "Enable Link Checker cache restore/save"
        required: false
        default: true
        type: boolean
      socialMode:
        description: "Social publishing operation (requires opt-in)"
        required: false
        default: publish
        type: choice
        options:
          - publish
          - dry-run
          - backfill
          - initialise
      socialResumeRun:
        description: "Optional main workflow run ID containing a discovery checkpoint"
        required: false
        default: ""
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  id-token: write
  pull-requests: write # Required for PR comments
  deployments: write # Required for Cloudflare Pages

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Front Matter

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          runtime: node

      - run: pnpm run validate-frontmatter
        name: Check front matter

  test:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          runtime: node
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for lastMod

      - name: Setup dist cache
        uses: actions/cache@v6
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dist-${{ hashFiles('pnpm-lock.yaml') }}
            ${{ runner.os }}-dist

      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          runtime: node
          cache: true

      # PR builds use dev mode
      - name: Build PR
        if: github.event_name == 'pull_request'
        run: pnpm build --devOutput

      # Regular production build for anything else
      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Prepare social announcement previews
        if: github.event_name == 'pull_request'
        run: node scripts/social/preview.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload social announcement previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: social-preview
          path: social-preview.json
          retention-days: 2

      # begin-snippet: verify-cli-use-with-dotnet-tool
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install Verify.Cli
        run: dotnet tool install --global Verify.Cli

      - name: Verify Feed
        # Skip feed verification in blog repository as it will change frequently
        if: github.repository == 'flcdrg/astro-blog-engine'
        id: verify_feed
        run: |
          verify --file dist/feed.xml --verified-dir verified --scrub-inline-datetime "yyyy-MM-ddTHH:mm:ss.fffZ"
      # end-snippet
      # begin-snippet: verify-cli-diff-in-ci
      - name: Diff files if error
        if: failure() && steps.verify_feed.outcome == 'failure' && github.repository == 'flcdrg/astro-blog-engine'
        run: |
          diff -u dist/feed.xml verified/feed.xml.verified.xml
      # end-snippet
      - name: Verify sitemap
        id: verify_sitemap
        # Skip sitemap verification in blog repository as it will be different
        if: github.repository == 'flcdrg/astro-blog-engine'
        run: |
          pnpm verify:sitemap

      - name: Diff sitemap if error
        if: failure() && steps.verify_sitemap.outcome == 'failure' && github.repository == 'flcdrg/astro-blog-engine'
        run: |
          diff -u verified/sitemap-0.xml.verified.xml verified/sitemap-0.xml.received.xml

      # begin-snippet: verify-cli-use-with-docker
      - name: Verify post
        id: verify_post
        if: github.event_name == 'pull_request' || github.repository == 'flcdrg/astro-blog-engine'
        run: docker run --rm --user "$(id -u):$(id -g)" -v $PWD:/tmp flcdrg/verify-cli --file /tmp/dist/2025/07/azure-pipeline-template-expression.html --verified-dir /tmp/verified --scrub-inline-pattern '(?<prefix>")/_astro/[^"]+(?<suffix>")' --scrub-inline-pattern '(?<prefix>title=")[^"]+(?<suffix>")' --scrub-inline-remove ' data-image-component="true"' --scrub-inline-pattern '(?<prefix>meta name="generator" content="Astro v)[\d\.]+(?<suffix>")' --verbosity detailed
      # end-snippet

      - name: Diff post if error
        if: failure() && steps.verify_post.outcome == 'failure'
        run: |
          ls -al verified/
          echo ""
          diff -u verified/azure-pipeline-template-expression.html.verified.html verified/azure-pipeline-template-expression.html.received.html

      # Only do this for 'flcdrg/astro-blog-engine' (as the content there is static)
      - name: Verify home
        if: github.repository == 'flcdrg/astro-blog-engine'
        id: verify_home
        run: docker run --rm --user "$(id -u):$(id -g)" -v $PWD:/tmp flcdrg/verify-cli --file /tmp/dist/index.html --verified-dir /tmp/verified --scrub-inline-pattern '(?<prefix>")/_astro/[^"]+(?<suffix>")' --scrub-inline-pattern '(?<prefix>title=")[^"]+(?<suffix>")' --scrub-inline-remove ' data-image-component="true"' --scrub-inline-pattern '(?<prefix>meta name="generator" content="Astro v)[\d\.]+(?<suffix>")' --verbosity detailed
      # end-snippet

      - name: Diff home if error
        if: failure() && steps.verify_home.outcome == 'failure' && github.repository == 'flcdrg/astro-blog-engine'
        run: |
          ls -al verified/
          echo ""
          diff -u verified/index.html.received.html verified/index.html.verified.html

      # dist as artifact
      - name: Upload dist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true # otherwise .NET.html doesn't get included!
          retention-days: 2

      - name: Upload wrangler.jsonc
        uses: actions/upload-artifact@v7
        with:
          name: wrangler.jsonc
          path: wrangler.jsonc
          retention-days: 2

  publish_to_cloudflare:
    runs-on: ubuntu-latest
    needs: build
    name: Publish to Cloudflare
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    if: github.ref == 'refs/heads/main'

    # Allow one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          install: false

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Setup IndexNow key
        if: github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'
        # Generate files dynamically to prevent them from being leaked in public repositories.
        # This example will put the file in the root directory of the site.You may change the location by yourself.
        run: echo ${{ secrets.INDEXNOW_KEY }} > dist/${{ secrets.INDEXNOW_KEY }}.txt

      - name: Download wrangler.jsonc
        uses: actions/download-artifact@v8
        with:
          name: wrangler.jsonc
          path: .

      - name: Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  social:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Publish social announcements
    if: github.ref == 'refs/heads/main' && vars.SOCIAL_PUBLISHING_ENABLED == 'true'
    environment: production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: social-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Verify discovery checkpoint run
        if: inputs.socialResumeRun != ''
        uses: actions/github-script@v8
        env:
          RESUME_RUN: ${{ inputs.socialResumeRun }}
        with:
          script: |
            const id = process.env.RESUME_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid checkpoint run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.head_branch !== 'main' || run.event === 'pull_request' ||
                run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.path !== '.github/workflows/main.yml') {
              throw new Error('Checkpoint must come from a trusted main publishing run');
            }
      - name: Download discovery checkpoint data
        if: inputs.socialResumeRun != ''
        uses: actions/download-artifact@v8
        with:
          name: social-discovery-checkpoint
          path: social-checkpoint-artifact
          run-id: ${{ inputs.socialResumeRun }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create repository-scoped automation token
        if: vars.SOCIAL_APP_ID != ''
        id: social-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SOCIAL_APP_ID }}
          private-key: ${{ secrets.SOCIAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Publish or reconcile social threads
        run: node scripts/social/run.ts "$SOCIAL_MODE"
        env:
          SOCIAL_MODE: ${{ inputs.socialMode || 'publish' }}
          SOCIAL_DEPLOYED: "true"
          SOCIAL_AUTO_MERGE: ${{ vars.SOCIAL_AUTO_MERGE || 'false' }}
          SOCIAL_DISCOVERY_CHECKPOINT: ${{ inputs.socialResumeRun != '' && 'social-checkpoint-artifact/social-discovery-checkpoint.json' || '' }}
          GH_TOKEN: ${{ steps.social-token.outputs.token || secrets.SOCIAL_GITHUB_TOKEN }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: social-backfill-report
          path: social-backfill-report.json
          if-no-files-found: ignore
      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: social-publishing-report
          path: social-publishing-report.json
          if-no-files-found: ignore
      - name: Upload discovery checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: social-discovery-checkpoint
          path: social-discovery-checkpoint.json
          if-no-files-found: ignore
      - name: Report publishing failure
        if: failure()
        run: echo 'Social publishing failed or needs reconciliation. Inspect the job log and automation/social-threads journal before retrying; do not delete pending operations.' >> "$GITHUB_STEP_SUMMARY"

  indexnow:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: IndexNow
    if: github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'
    steps:
      - name: indexnow-action
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: "https://david.gardiner.net.au/sitemap-0.xml"
          limit: 50
          key-location: "https://david.gardiner.net.au/${{ secrets.INDEXNOW_KEY }}.txt"
          key: ${{ secrets.INDEXNOW_KEY }}

  publish_to_cloudflare_pr:
    runs-on: ubuntu-latest
    needs: build
    name: Preview PR on Cloudflare
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}

    if: github.ref != 'refs/heads/main'

    # Allow one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          runtime: node

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Cloudflare Preview
        uses: cloudflare/wrangler-action@v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Output variables
        run: echo $OUTPUTS
        env:
          OUTPUTS: ${{ toJson(steps.deploy.outputs) }}

      - name: Record preview attachment origin
        run: node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("deployment.json", JSON.stringify({head:process.env.PR_HEAD_SHA,origin:new URL(process.env.PREVIEW_URL).origin}));'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}

      - name: Upload preview attachment origin
        uses: actions/upload-artifact@v7
        with:
          name: social-preview-deployment
          path: deployment.json
          retention-days: 2

      - name: HTTP redirect testing
        shell: pwsh
        run: |
          $url = "${{ steps.deploy.outputs.deployment-url }}"
          Write-Host "Testing URL: $url"

          ./Test-HttpRedirects.ps1 -url $url

          (Get-Content httptraces.txt)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install Verify.Cli
        run: dotnet tool install --global Verify.Cli

      - name: Verify HTTP traces
        run: |
          verify --file httptraces-scrubbed.txt --verified-dir verified

      - name: Diff files if error
        if: failure()
        run: |
          diff -u --strip-trailing-cr verified/httptraces-scrubbed.txt.verified.txt httptraces-scrubbed.txt

      - name: Upload scripts as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verified-http-traces
          path: verified
          retention-days: 2

  update_readme:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Update GitHub Profile Readme
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'

    steps:
      - name: Workflow Dispatch
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: Update
          ref: ${{ github.event.ref }}
          repo: flcdrg/flcdrg
          token: ${{ secrets.GH_FLCDRG_PROFILE }}

  ping_superfeedr:
    runs-on: ubuntu-latest
    needs: publish_to_cloudflare
    name: Ping Superfeedr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'flcdrg/astro-blog-engine'

    steps:
      - shell: pwsh
        run: |
          $url = "https://david.gardiner.net.au/feed.xml"
          Write-Host "Pinging Superfeedr with URL: $url"

          $response = Invoke-WebRequest -Method Post -Uri "https://flcdrg.superfeedr.com" -Body @{ "hub.mode" = "publish"; "hub.url" = $url }
          Write-Host "Response: $($response.StatusCode)"

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    name: Lighthouse Report

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Pnpm Setup
        uses: pnpm/setup@v3
        with:
          runtime: node

      - name: Extract latest post URL from feed
        id: extract-url
        run: |
          [xml]$feedXml = Get-Content "dist/feed.xml"
          $firstEntry = $feedXml.feed.entry[0]
          $originalUrl = $firstEntry.link | Where-Object { $_.rel -eq "alternate" -and $_.type -eq "text/html" } | Select-Object -First 1 | ForEach-Object { $_.href }
          $localhostUrl = $originalUrl -replace "https://[^/]+", "http://localhost"

          # append .html to the URL if it doesn't already end with .html
          if ($localhostUrl -notlike "*.html") {
            $localhostUrl += ".html"
          }
          echo "latest-url=$localhostUrl" >> $env:GITHUB_OUTPUT
          echo "Latest URL: $localhostUrl"
        shell: pwsh

      - name: run Lighthouse CI
        run: |
          # Robots.txt defaults to disallow, which is not what we want for the lighthouse test
          rm dist/robots.txt

          pnpm lhci autorun --collect.url="${{ steps.extract-url.outputs.latest-url }}" --collect.url="http://localhost/index.html" --collect.url="http://localhost/speaking.html" --collect.url="http://localhost/2025.html"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse Summary
        run: |
          # Generate a summary of the Lighthouse report
          $json = Get-Content .lighthouseci/links.json | ConvertFrom-Json

          $markDown = "## Lighthouse Report Summary`n`n"
          $markDown += "| URL | Performance | Accessibility | Best Practices | SEO | PWA |`n"
          $markDown += "| --- | :---: | :---: | :---: | :---: | :---: |`n"

          foreach ($property in $json.PSObject.Properties) {
            $url = $property.Name
            $reportUrl = $property.Value
            
            # Find all related lhr files for this URL
            $lhrFiles = Get-ChildItem .lighthouseci/lhr-*.json | Where-Object { 
              $content = Get-Content $_ | ConvertFrom-Json
              $content.requestedUrl -eq $url -or $content.finalUrl -eq $url
            }
            
            # Get the latest file based on fetchTime
            $latestLhrFile = $lhrFiles | ForEach-Object {
              $content = Get-Content $_ | ConvertFrom-Json
              [PSCustomObject]@{
                File = $_
                FetchTime = $content.fetchTime
              }
            } | Sort-Object -Property FetchTime -Descending | Select-Object -First 1
            
            if ($latestLhrFile) {
              $lhrContent = Get-Content $latestLhrFile.File | ConvertFrom-Json
              
              # Calculate scores - multiply by 100 and round to show as percentages
              $performance = [Math]::Round($lhrContent.categories.performance.score * 100)
              $accessibility = [Math]::Round($lhrContent.categories.accessibility.score * 100)
              $bestPractices = [Math]::Round($lhrContent.categories.'best-practices'.score * 100)
              $seo = [Math]::Round($lhrContent.categories.seo.score * 100)
              $pwa = if ($lhrContent.categories.pwa.score) { [Math]::Round($lhrContent.categories.pwa.score * 100) } else { "N/A" }
              
              # Add emoji indicators based on score
              $getEmoji = {
                param($score)
                if ($score -eq "N/A") { return "N/A" }
                if ($score -ge 90) { return "✅ $score%" }
                elseif ($score -ge 50) { return "⚠️ $score%" }
                else { return "❌ $score%" }
              }
              
              # Display scores with emojis
              $markDown += "| [$url]($reportUrl) | $(&$getEmoji $performance) | $(&$getEmoji $accessibility) | $(&$getEmoji $bestPractices) | $(&$getEmoji $seo) | $(&$getEmoji $pwa) |`n"
            }
            else {
              $markDown += "| [$url]($reportUrl) | No data | No data | No data | No data | No data |`n"
            }
          }

          echo $markDown >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Lighthouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 5

  linkChecker:
    runs-on: ubuntu-latest
    needs: build
    name: Link Checker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache lychee results (e.g. to avoid hitting rate limits)
      - name: Restore lychee cache
        id: restore-cache
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.linkCache == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: false
          output: ${{ github.workspace }}/output.json
          format: json
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          args: --root-dir "$(pwd)/dist/" 'dist/**/*.html' --cache --max-cache-age 7d --max-retries 0 --max-concurrency 20 --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:137.0) Gecko/20100101 Firefox/137.0" --fallback-extensions html -v --cache-exclude-status '429' --insecure --accept '200..=204,403,429'

      - name: Report results
        run: |
          ./Generate-LycheeReport.ps1 -InputJsonFile output.json -OutputMarkdownFile output.md

          ls -al

          cat output.md

          cat output.md >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Publish results
        uses: actions/upload-artifact@v7
        with:
          name: link-checker-results
          path: output.*
          retention-days: 5

      - name: Save lychee cache
        uses: actions/cache/save@v6
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.linkCache == 'true') }}
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
